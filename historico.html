<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Encomendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('images.jpeg');
            background-color: #f0f0f0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            padding: 40px 20px 60px;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
        }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding: 5px 0;
            font-size: 12px;
        }
        #tabelaHistorico td, #tabelaHistorico th {
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container mx-auto">
        <h2 class="text-center mb-4">Histórico de Encomendas</h2>
        <div class="row g-2 mb-3">
            <div class="col-8">
                <input type="text" class="form-control" id="apartamentoHistorico" placeholder="Número do apartamento">
            </div>
            <div class="col-4">
                <button class="btn btn-primary w-100" id="btnBuscarHistorico">Buscar</button>
            </div>
        </div>

        <div id="semResultado" class="alert alert-info" style="display: none;">
            Nenhuma encomenda retirada encontrada para este apartamento.
        </div>

        <table class="table table-striped" id="tabelaHistorico" style="display: none;">
            <thead>
                <tr>
                    <th>Destinatário</th>
                    <th>Descrição</th>
                    <th>Chegada</th>
                    <th>Retirado por</th>
                    <th>Retirada</th>
                </tr>
            </thead>
            <tbody id="corpoTabelaHistorico"></tbody>
        </table>

        <a href="index.html" class="btn btn-secondary w-100 mt-2">Voltar</a>
    </div>

    <footer class="footer">
        &copy; 2025 - SafePack. Todos os direitos reservados.
    </footer>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        async function buscarHistorico() {
            let numeroApartamento = document.getElementById('apartamentoHistorico').value.trim();
            let tabela = document.getElementById('tabelaHistorico');
            let corpo = document.getElementById('corpoTabelaHistorico');
            let semResultado = document.getElementById('semResultado');

            corpo.innerHTML = '';
            tabela.style.display = 'none';
            semResultado.style.display = 'none';

            if (!numeroApartamento) {
                alert('Informe o número do apartamento.');
                return;
            }

            try {
                let response = await fetch(`${API_BASE}/historico/${numeroApartamento}`);
                if (!response.ok) {
                    alert('Erro ao buscar histórico.');
                    return;
                }
                let dados = await response.json();
                if (dados.historico.length === 0) {
                    semResultado.style.display = 'block';
                    return;
                }
                dados.historico.forEach(item => {
                    let linha = document.createElement('tr');
                    linha.innerHTML = `
                        <td>${item.destinatario ?? '-'}</td>
                        <td>${item.descricao ?? '-'}</td>
                        <td>${item.dataChegada ?? '-'}</td>
                        <td>${item.retiradoPor ?? '-'}</td>
                        <td>${item.dataRetirada ?? '-'}</td>
                    `;
                    corpo.appendChild(linha);
                });
                tabela.style.display = 'table';
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Não foi possível conectar ao servidor.');
            }
        }

        document.getElementById('btnBuscarHistorico').addEventListener('click', buscarHistorico);
        document.getElementById('apartamentoHistorico').addEventListener('keyup', function (event) {
            if (event.key === 'Enter') buscarHistorico();
        });
    </script>
</body>
</html>
