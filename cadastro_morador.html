<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Moradores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('images.jpeg');
            background-color: #f0f0f0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            margin: 20px 0;
        }
        .form-label .required { color: red; }
        .mensagem-sucesso {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            text-align: center;
            border-radius: 5px;
        }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            padding: 5px 0;
            font-size: 12px;
        }
        table.table { margin-top: 25px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Cadastro de Morador</h2>
        <form id="moradorForm">
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">Nº Apartamento <span class="required">*</span></label>
                    <input type="text" class="form-control" id="numApartamento" required>
                </div>
                <div class="col-6">
                    <label class="form-label">Torre / Bloco</label>
                    <input type="text" class="form-control" id="torre">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Nome completo <span class="required">*</span></label>
                <input type="text" class="form-control" id="nomeMorador" required>
            </div>
            <div class="mb-3">
                <label class="form-label">CPF <span class="required">*</span></label>
                <input type="text" class="form-control" id="cpfMorador" maxlength="14" placeholder="000.000.000-00" required oninput="formatarCPF(this)">
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar Morador</button>
            <a href="index.html" class="btn btn-secondary w-100 mt-2">Voltar</a>
        </form>
        <div class="mensagem-sucesso" id="mensagemSucesso">Morador cadastrado com sucesso!</div>

        <table class="table table-striped" id="tabelaMoradores">
            <thead>
                <tr><th>Apto</th><th>Torre</th><th>Nome</th><th>CPF</th><th></th></tr>
            </thead>
            <tbody id="corpoTabelaMoradores"></tbody>
        </table>
    </div>

    <footer class="footer">
        &copy; 2025 - SafePack. Todos os direitos reservados.
    </footer>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';

        // Extrai uma mensagem de erro legível tanto de um HTTPException (detail: string)
        // quanto de um erro de validação automática do FastAPI/Pydantic (detail: lista de objetos)
        function extrairMensagemErro(erro) {
            if (!erro) return "Tente novamente.";
            if (typeof erro.detail === 'string') return erro.detail;
            if (Array.isArray(erro.detail)) {
                return erro.detail.map(item => item.msg || JSON.stringify(item)).join(' | ');
            }
            return "Tente novamente.";
        }

        function formatarCPF(input) {
            let valor = input.value.replace(/\D/g, '').slice(0, 11);
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            input.value = valor;
        }

        async function carregarMoradores() {
            try {
                let response = await fetch(`${API_BASE}/moradores-cadastrados/`);
                if (!response.ok) return;
                let dados = await response.json();
                let corpo = document.getElementById('corpoTabelaMoradores');
                corpo.innerHTML = '';
                dados.moradores.forEach(m => {
                    let linha = document.createElement('tr');
                    linha.innerHTML = `<td>${m.num_apartamento}</td><td>${m.torre ?? '-'}</td><td>${m.nome_morador}</td><td>${m.cpf_morador}</td>` +
                        `<td><button type="button" class="btn btn-outline-danger btn-sm" onclick="excluirMorador(${m.id}, '${m.nome_morador.replace(/'/g, "\\'")}')">Excluir</button></td>`;
                    corpo.appendChild(linha);
                });
            } catch (error) {
                console.error('Erro ao carregar moradores:', error);
            }
        }

        // Exclui um morador cadastrado, pedindo confirmação antes
        async function excluirMorador(id, nome) {
            if (!confirm(`Tem certeza que deseja excluir o morador "${nome}"?`)) return;

            try {
                let response = await fetch(`${API_BASE}/moradores/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    carregarMoradores();
                } else {
                    let erro = await response.json();
                    alert(`Erro ao excluir morador: ${extrairMensagemErro(erro)}`);
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                alert('Erro ao conectar com o servidor.');
            }
        }

        document.getElementById('moradorForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            let dados = {
                num_apartamento: parseInt(document.getElementById('numApartamento').value, 10),
                torre: document.getElementById('torre').value,
                nome_morador: document.getElementById('nomeMorador').value,
                cpf_morador: document.getElementById('cpfMorador').value
            };

            try {
                let response = await fetch(`${API_BASE}/moradores/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    document.getElementById('mensagemSucesso').style.display = 'block';
                    setTimeout(() => document.getElementById('mensagemSucesso').style.display = 'none', 3000);
                    document.getElementById('moradorForm').reset();
                    carregarMoradores();
                } else {
                    let erro = await response.json();
                    alert(`Erro ao cadastrar morador: ${extrairMensagemErro(erro)}`);
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                alert('Erro ao conectar com o servidor.');
            }
        });

        carregarMoradores();
    </script>
</body>
</html>
